<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>冰箱孤兒食材拯救器</title>
  <!-- 引入 Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-amber-50/50 text-slate-800 min-h-screen p-4 md:p-8 flex justify-center items-start">

  <div id="app" class="w-full max-w-xl bg-white rounded-2xl shadow-sm border border-amber-100 p-6 flex flex-col gap-5">
    <!-- 標題區 -->
    <div>
      <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
        <span>🍲</span> 冰箱孤兒食材拯救器
      </h1>
      <p class="text-sm text-slate-500 mt-1">
        當冰箱只剩零散食材，交給電鍋與極簡料理，熟了「打開喇一喇」就能開動！
      </p>
    </div>

    <!-- 食材輸入與標籤區 -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-semibold text-slate-700">冰箱殘局（輸入食材後按 Enter 或點新增）</label>
      <div class="flex gap-2">
        <input 
          v-model="ingredientInput" 
          @keyup.enter="addIngredient"
          type="text" 
          placeholder="例如：幾瓣落單的蒜頭、半罐玉米粒" 
          class="flex-1 text-sm px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500"
        />
        <button 
          @click="addIngredient" 
          class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-sm font-medium rounded-lg transition"
        >
          新增
        </button>
      </div>

      <!-- 食材標籤 -->
      <div class="flex flex-wrap gap-1.5 mt-2 min-h-[32px]">
        <span 
          v-for="(item, index) in ingredients" 
          :key="index"
          class="inline-flex items-center gap-1.5 bg-amber-100/70 text-amber-900 border border-amber-200 text-xs px-2.5 py-1 rounded-full font-medium"
        >
          {{ item }}
          <button @click="removeIngredient(index)" class="hover:text-rose-600 font-bold text-sm leading-none">&times;</button>
        </span>
        <span v-if="ingredients.length === 0" class="text-xs text-slate-400 italic">目前沒有食材，請新增上方食材</span>
      </div>
    </div>

    <!-- 生成按鈕 -->
    <button 
      @click="generateRecipe" 
      :disabled="isLoading || ingredients.length === 0"
      class="w-full py-3 bg-amber-600 hover:bg-amber-700 disabled:bg-slate-300 text-white font-medium rounded-xl transition shadow-sm flex items-center justify-center gap-2"
    >
      <span v-if="isLoading" class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span>
      <span>{{ isLoading ? 'AI 大廚正在搶救食材...' : '拯救這些食材！產生一鍵料理' }}</span>
    </button>

    <!-- 錯誤訊息提示 -->
    <div v-if="errorMessage" class="p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-lg text-xs leading-relaxed">
      {{ errorMessage }}
    </div>

    <!-- 食譜結果卡片 -->
    <div v-if="recipe" class="mt-2 border-t border-slate-100 pt-5 flex flex-col gap-4">
      <div class="flex items-baseline justify-between gap-2">
        <h2 class="text-lg font-bold text-slate-900">{{ recipe.dish_name }}</h2>
        <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-medium shrink-0">{{ recipe.estimated_time }}</span>
      </div>
      
      <p class="text-xs text-slate-600 leading-relaxed bg-amber-50/50 p-3 rounded-lg border border-amber-100/60">
        {{ recipe.description }}
      </p>

      <!-- 額外所需調味料/輔料 -->
      <div v-if="recipe.basic_seasonings && recipe.basic_seasonings.length" class="bg-slate-50 p-3 rounded-lg">
        <div class="text-xs font-semibold text-slate-700 mb-1">補充常備調料：</div>
        <div class="text-xs text-slate-500">{{ recipe.basic_seasonings.join('、') }}</div>
      </div>

      <!-- 製作步驟 -->
      <div>
        <div class="text-sm font-semibold text-slate-800 mb-2">料理救贖步驟</div>
        <ol class="space-y-2 text-xs text-slate-600 list-decimal list-inside">
          <li v-for="(step, idx) in recipe.steps" :key="idx" class="leading-relaxed">
            <span class="text-slate-800">{{ step }}</span>
          </li>
        </ol>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const ingredientInput = ref('');
        const ingredients = ref([
          '假日沒煮完的烏龍麵',
          '倒不滿一杯牛奶',
          '不知何去何從的鮪魚罐頭',
          '三三兩兩的蒜頭',
          '煮膩了的壽喜燒醬料'
        ]);
        const isLoading = ref(false);
        const errorMessage = ref('');
        const recipe = ref(null);

        const addIngredient = () => {
          const val = ingredientInput.value.trim();
          if (val && !ingredients.value.includes(val)) {
            ingredients.value.push(val);
            ingredientInput.value = '';
          }
        };

        const removeIngredient = (index) => {
          ingredients.value.splice(index, 1);
        };

        const generateRecipe = async () => {
          isLoading.value = true;
          errorMessage.value = '';
          recipe.value = null;

          try {
            // 打後端伺服器路徑，不暴露金鑰
            const response = await fetch('/api/generate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                ingredients: ingredients.value
              })
            });

            const data = await response.json();
            if (!response.ok) {
              throw new Error(data.error || 'API 請求失敗');
            }

            recipe.value = data;
          } catch (err) {
            errorMessage.value = `生成失敗：${err.message}`;
          } finally {
            isLoading.value = false;
          }
        };

        return {
          ingredientInput,
          ingredients,
          isLoading,
          errorMessage,
          recipe,
          addIngredient,
          removeIngredient,
          generateRecipe
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
